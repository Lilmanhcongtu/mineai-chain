[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineai"
version = "0.2.0rc1"
description = "MineAI blockchain: public testnet release candidate (devnet/testnet software; not production-ready)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.35,<1",
  "cryptography>=44,<52",
  "jinja2>=3.1,<4",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5"]

[project.scripts]
mineai-node = "mineai.node:main"
mineai-wallet = "mineai.wallet:main"
mineai-miner = "mineai.miner:main"

[tool.setuptools.packages.find]
include = ["mineai*"]

[tool.setuptools.package-data]
mineai = ["templates/*.html"]
