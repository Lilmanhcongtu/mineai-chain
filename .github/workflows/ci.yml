name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Version
        run: python -m mineai version
      - name: Test suite
        run: python -m pytest -q -p no:cacheprovider

  linux-install:
    name: linux install script + node smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run packaging/linux/install.sh
        run: sh packaging/linux/install.sh
      - name: Start a testnet node and query it
        env:
          MINEAI_NETWORK: testnet
          MINEAI_DATA_DIR: ${{ runner.temp }}/mineai-data
        run: |
          "$HOME/.local/bin/mineai-node" > "$RUNNER_TEMP/node.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/api/v1/status && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/v1/status | grep '"network":"testnet"'
          curl -fsS http://127.0.0.1:18080/metrics | grep mineai_chain_height
      - name: Node log
        if: always()
        run: cat "$RUNNER_TEMP/node.log" || true
