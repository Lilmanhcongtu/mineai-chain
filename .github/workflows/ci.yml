name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Version
        run: python -m mineai version
      - name: Test suite
        run: python -m pytest -q -p no:cacheprovider

  linux-install:
    name: linux install + documented walkthrough (docs/INSTALL.md section 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (packaging/linux/install.sh)
        run: |
          sh packaging/linux/install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Commands exist and run
        run: |
          for c in mineai mineai-node mineai-wallet mineai-miner; do command -v "$c"; done
          mineai version
      - name: Node, wallet, miner, balance, offline check
        env:
          MINEAI_NETWORK: testnet
          MINEAI_DATA_DIR: ${{ runner.temp }}/mineai-data
        run: |
          set -eu
          mineai-node > "$RUNNER_TEMP/node.log" 2>&1 &
          NODE_PID=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/api/v1/status >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/api/v1/status | grep '"network":"testnet"'
          curl -fsS http://127.0.0.1:18080/metrics | grep mineai_chain_height

          export MINEAI_WALLET_PASSWORD="$(openssl rand -base64 24)"
          cd "$RUNNER_TEMP"
          mineai wallet --network testnet create --wallet me.testnet.wallet.json
          ADDR="$(mineai wallet --network testnet address --wallet me.testnet.wallet.json | tail -n 1)"
          case "$ADDR" in TMAI*) ;; *) echo "unexpected address: $ADDR"; exit 1;; esac
          mineai miner --network testnet --address "$ADDR" --blocks 3 --threads 2
          mineai wallet --network testnet balance --wallet me.testnet.wallet.json | tee balance.txt
          grep "Confirmed: 75 MAI" balance.txt

          kill "$NODE_PID"; wait "$NODE_PID" || true
          mineai check --network testnet --data-dir "$MINEAI_DATA_DIR"
      - name: Node log
        if: always()
        run: cat "$RUNNER_TEMP/node.log" || true
